name: SolarCycle
description: 'SolarCycle is a technology-driven solar recycling company founded in 2022 that provides
  certified end-of-life management for solar energy systems. It recovers up to 97% of panel materials
  (silver, copper, gold, aluminum, glass), recycles power electronics such as inverters and transformers,
  and handles logistics and field operations for large-scale solar projects, achieving 100% landfill
  diversion. SolarCycle operates seven facilities across Georgia, Illinois, Texas, Nevada, and Arizona
  and is building a domestic recycled-solar-glass manufacturing plant, serving major solar companies
  including Q Cells, AES, Orsted, and Sunrun. It is a portfolio company of Fifth Wall. This is a physical
  circular-economy operations business with no public developer or API surface.'
